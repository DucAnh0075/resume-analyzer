<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Testformular – Beispiel GmbH Bewerbung</title>
  <style>body{font:15px system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem}label{display:block;margin-top:.8rem;font-weight:500}input,select,textarea{width:100%;box-sizing:border-box;padding:.4rem;margin-top:.2rem}.check{display:flex;gap:.5rem;align-items:center;font-weight:400}.check input{width:auto}</style>
</head>
<body>
  <h1>Bewerbung (Testformular)</h1>
  <p>Nur zum Testen des Agenten. Es wird nichts gesendet.</p>
  <form id="f">
    <label for="fn">Vorname *</label><input id="fn" name="first_name" required />
    <label for="ln">Nachname *</label><input id="ln" name="last_name" required />
    <label for="em">E-Mail *</label><input id="em" type="email" required />
    <label for="ph">Telefon</label><input id="ph" type="tel" />
    <label for="co">Land</label>
    <select id="co"><option value="">Bitte wählen</option><option>Deutschland</option><option>Österreich</option><option>Schweiz</option></select>
    <div><b class="label">Stadt *</b>
      <div style="position:relative"><input id="city" role="combobox" aria-autocomplete="list" aria-controls="cities" required autocomplete="off" />
      <ul id="cities" role="listbox" hidden style="position:absolute;margin:0;padding:0;list-style:none;background:#fff;border:1px solid #ccc;width:100%"></ul></div></div>
    <section><h2 style="font-size:1rem;margin:1rem 0 .2rem">Einfach Bewerben</h2>
      <div class="dropzone" style="border:2px dashed #38f;padding:1rem;text-align:center">Parser <input type="file" hidden /></div></section>
    <section><h2 style="font-size:1rem;margin:1rem 0 .2rem">Lebenslauf *</h2>
      <div><div><div><div class="dropzone" id="dz" style="border:2px dashed #38f;padding:1rem;text-align:center">Datei hier ablegen (nur Drop) <input id="cv" type="file" hidden /> <span id="dzname"></span></div></div></div></div></section>
    <label for="cl">Anschreiben</label><input id="cl" type="file" />
    <label for="why">Warum möchten Sie bei uns arbeiten? *</label><textarea id="why" rows="4" required></textarea>
    <label class="check"><input type="checkbox" required /> Ich habe die Datenschutzerklärung gelesen und stimme zu *</label>
    <label class="check"><input type="checkbox" /> Newsletter abonnieren</label>
    <button type="submit" style="margin-top:1rem;padding:.5rem 1rem">Bewerbung absenden</button>
  </form>
  <script>
    // simple autocomplete: typing shows suggestions, the field is only valid once one was clicked
    const city = document.getElementById("city"), list = document.getElementById("cities");
    city.addEventListener("input", () => {
      city.setCustomValidity("Bitte einen Vorschlag wählen");
      list.innerHTML = ["", " (Landkreis Harburg)", " (Hessen)"].map((x) => `<li role="option" style="padding:.3rem;cursor:pointer">${city.value}${x}</li>`).join("");
      list.hidden = !city.value;
    });
    list.addEventListener("click", (e) => { city.value = e.target.textContent; city.setCustomValidity(""); list.hidden = true; });
    // dropzone only reacts to drop events, not to the input's change event
    const dz = document.getElementById("dz");
    dz.addEventListener("dragover", (e) => e.preventDefault());
    dz.addEventListener("drop", (e) => { e.preventDefault(); document.getElementById("dzname").textContent = e.dataTransfer.files[0]?.name ?? ""; });
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      document.body.innerHTML = "<h1>Vielen Dank für Ihre Bewerbung</h1><p>Ihre Bewerbung ist eingegangen. (Testformular, nichts wurde gesendet)</p>";
    });
  </script>
</body>
</html>
