<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Testformular – Beispiel GmbH Bewerbung</title>
  <style>body{font:15px system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem}label{display:block;margin-top:.8rem;font-weight:500}input,select,textarea{width:100%;box-sizing:border-box;padding:.4rem;margin-top:.2rem}.check{display:flex;gap:.5rem;align-items:center;font-weight:400}.check input{width:auto}</style>
</head>
<body>
  <h1>Bewerbung (Testformular)</h1>
  <p>Nur zum Testen des Agenten. Es wird nichts gesendet.</p>
  <form id="f">
    <label for="fn">Vorname *</label><input id="fn" name="first_name" required />
    <label for="ln">Nachname *</label><input id="ln" name="last_name" required />
    <label for="em">E-Mail *</label><input id="em" type="email" required />
    <label for="ph">Telefon</label><input id="ph" type="tel" />
    <label for="co">Land</label>
    <select id="co"><option value="">Bitte wählen</option><option>Deutschland</option><option>Österreich</option><option>Schweiz</option></select>
    <label for="cv">Lebenslauf *</label><input id="cv" type="file" required />
    <label for="cl">Anschreiben</label><input id="cl" type="file" />
    <label for="why">Warum möchten Sie bei uns arbeiten? *</label><textarea id="why" rows="4" required></textarea>
    <label class="check"><input type="checkbox" required /> Ich habe die Datenschutzerklärung gelesen und stimme zu *</label>
    <label class="check"><input type="checkbox" /> Newsletter abonnieren</label>
    <button type="submit" style="margin-top:1rem;padding:.5rem 1rem">Bewerbung absenden</button>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      document.body.innerHTML = "<h1>Vielen Dank für Ihre Bewerbung</h1><p>Ihre Bewerbung ist eingegangen. (Testformular, nichts wurde gesendet)</p>";
    });
  </script>
</body>
</html>
